# Include inside the existing HTTPS server block. Keep the path prefix intact.
location = /careeros { return 308 /careeros/; }
location ^~ /careeros/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 21m;
    proxy_read_timeout 120s;
    proxy_buffering off;
    # OAuth callback codes must not appear in the legacy combined access log.
    access_log off;
}
location = /.well-known/oauth-authorization-server/careeros/oauth {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}
location = /.well-known/oauth-protected-resource/careeros/mcp {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}
