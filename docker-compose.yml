version: "2.4"
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: careeros
      POSTGRES_DB: careeros
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careeros -d careeros"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  web:
    build: .
    image: careeros:local
    restart: unless-stopped
    env_file: .env
    ports: ["127.0.0.1:3100:3100"]
    volumes: ["assets:/app/data"]
    depends_on:
      db: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1024m
    pids_limit: 160
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/careeros/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
  worker:
    image: careeros:local
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    env_file: .env
    volumes: ["assets:/app/data"]
    depends_on:
      db: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 100
    stop_grace_period: 110s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "try{process.exit(Date.now()-require('fs').statSync('/tmp/careeros-worker-heartbeat').mtimeMs<45000?0:1)}catch{process.exit(1)}",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *logging
volumes:
  postgres:
  assets:
